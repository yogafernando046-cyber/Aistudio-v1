name: Build Kasir Idris APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Verify source files
        shell: bash
        run: |
          test -f package.json
          test -f www/index.html
          test -f resources/kasir-idris-icon.png
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('www/index.html', 'utf8');
          for (const token of ['function printTx(id)', 'receiptPreviewModal', 'function closeReceiptPreview()', 'async function startScan(mode)', 'function renderDeletedSales()', 'function syncDeletedSalesToServer()', 'function loadDeletedSalesFromServer()']) {
            if (!html.includes(token)) { console.error('Fitur wajib tidak ditemukan:', token); process.exit(1); }
          }
          console.log('Pemeriksaan sumber Kasir Idris lolos.');
          NODE
      - name: Install dependencies
        run: npm install
      - name: Bundle biometric bridge
        run: npm run build:biometric
      - name: Add Android platform
        run: npx cap add android

      - name: Install native Android print bridge
        shell: bash
        run: |
          set -e
          APP_DIR="android/app/src/main/java/id/yogafernando/kasiridris"
          mkdir -p "$APP_DIR"
          cp src/android/NativePrintPlugin.java "$APP_DIR/NativePrintPlugin.java"
          MAIN="$APP_DIR/MainActivity.java"
          if [ ! -f "$MAIN" ]; then
            cat > "$MAIN" <<'JAVA'
          package id.yogafernando.kasiridris;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  registerPlugin(NativePrintPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          elif ! grep -q 'NativePrintPlugin.class' "$MAIN"; then
            python - <<'PYMAIN'
          from pathlib import Path
          p = Path("android/app/src/main/java/id/yogafernando/kasiridris/MainActivity.java")
          s = p.read_text()
          s = s.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport id.yogafernando.kasiridris.NativePrintPlugin;")
          s = s.replace("extends BridgeActivity {", "extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(NativePrintPlugin.class);\n        super.onCreate(savedInstanceState);\n    }")
          p.write_text(s)
          PYMAIN
          fi
      - name: Apply launcher icon including adaptive Android icons
        shell: bash
        run: |
          set -e
          python -m pip install --quiet pillow
          python - <<'PYICON'
          from PIL import Image
          from pathlib import Path

          source = Image.open("resources/kasir-idris-icon.png").convert("RGBA")
          w, h = source.size
          side = min(w, h)
          source = source.crop(((w-side)//2, (h-side)//2, (w+side)//2, (h+side)//2))
          res = Path("android/app/src/main/res")

          # Ikon biasa untuk launcher Android lama.
          for density, size in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size,size), Image.Resampling.LANCZOS)
              icon.save(folder/"ic_launcher.png")
              icon.save(folder/"ic_launcher_round.png")

          # Ikon foreground untuk adaptive icon Android 8+.
          for density, size in {"mdpi":108,"hdpi":162,"xhdpi":216,"xxhdpi":324,"xxxhdpi":432}.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              art_size = int(size * 0.66)
              art = source.resize((art_size, art_size), Image.Resampling.LANCZOS)
              canvas.alpha_composite(art, ((size-art_size)//2, (size-art_size)//2))
              canvas.save(folder/"ic_launcher_foreground.png")

          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = """<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">
              <background android:drawable=\"@color/ic_launcher_background\"/>
              <foreground android:drawable=\"@mipmap/ic_launcher_foreground\"/>
          </adaptive-icon>
          """
          (adaptive/"ic_launcher.xml").write_text(xml, encoding="utf-8")
          (adaptive/"ic_launcher_round.xml").write_text(xml, encoding="utf-8")

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          colors = values / "ic_launcher_background.xml"
          if not colors.exists():
              colors.write_text("<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources><color name=\"ic_launcher_background\">#FFFFFF</color></resources>\n", encoding="utf-8")
          print("Ikon launcher biasa dan adaptive Android berhasil diperbarui.")
          PYICON

      - name: Configure Android camera permission
        shell: bash
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          grep -q 'android.hardware.camera' "$MANIFEST" || sed -i '/<application/i\    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"
          grep -q 'android.permission.CAMERA' "$MANIFEST"
      - name: Sync web app
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasir-idris-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
